[tool.poetry]
name = "medical-triage-api"
version = "0.1.0"
description = "Triagem automática de urgência em laudos médicos — API FastAPI com inferência ONNX, CI/CD, Airflow e observabilidade Prometheus/Grafana. FIAP Pós Tech ML, Fase 3"
authors = ["Grupo 102"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = "^3.11"
scikit-learn = "^1.6"
pandas = "^2.2"
numpy = "^2.1"
joblib = "^1.4"
fastapi = "^0.115"
uvicorn = { extras = ["standard"], version = "^0.34" }
pydantic = "^2.10"
pydantic-settings = "^2.7"
python-dotenv = "^1.0"
prometheus-client = "^0.21"
onnx = "^1.17"
onnxruntime = "^1.20"
skl2onnx = "^1.18"
httpx = "^0.28"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3"
pytest-cov = "^6.0"
ruff = "^0.9"
pre-commit = "^4.0"

[build-system]
requires = ["poetry-core>=2.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "--ignore=data --ignore=models --ignore=airflow"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B"]
# E501: line-too-long — delegado ao ruff format.
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["N802"]
