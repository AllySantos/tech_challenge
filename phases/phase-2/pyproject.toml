[tool.poetry]
name = "ecommerce-recomendation-model"
version = "0.1.0"
description = "Sistema de recomendação de produtos para e-commerce (MLP / embedding-based, PyTorch) — FIAP Pós Tech ML, Fase 2"
authors = ["Grupo 102"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = "^3.11"
torch = "^2.9"
scikit-learn = "^1.8"
mlflow = "^3.11"
dvc = "^3.61"
pandas = "^2.3"
numpy = "^2.4"
pydantic = "^2.13"
pydantic-settings = "^2.7"
python-dotenv = "^1.2"
pyyaml = "^6.0"
fastapi = "^0.115"
uvicorn = { extras = ["standard"], version = "^0.34" }

[tool.poetry.group.dev.dependencies]
pytest = "^9.0"
pytest-cov = "^7.1"
ruff = "^0.15"
pre-commit = "^4.4"
httpx = "^0.28"
httpx2 = "^2.9"

[build-system]
requires = ["poetry-core>=2.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "--ignore=data --ignore=notebooks"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B"]
# E501: line-too-long — delegado ao ruff format.
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["N802"]