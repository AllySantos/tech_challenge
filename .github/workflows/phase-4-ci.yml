name: Phase 4 — Credit Scoring Observability

on:
  push:
    branches: ["main"]
    paths:
      - "phases/phase-4/**"
      - ".github/workflows/phase-4-ci.yml"
  pull_request:
    branches: ["**"]
    paths:
      - "phases/phase-4/**"
      - ".github/workflows/phase-4-ci.yml"

concurrency:
  group: phase-4-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: phases/phase-4

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Poetry
        run: pipx install poetry
      - name: Install dependencies
        run: poetry install --no-interaction
      - name: Run tests
        run: poetry run pytest -q
