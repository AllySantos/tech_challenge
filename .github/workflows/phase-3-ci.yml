name: Phase 3 — Core Pipeline

on:
  push:
    branches: ["main"]
    paths:
      - "phases/phase-3/**"
      - ".github/workflows/phase-3-ci.yml"
  pull_request:
    branches: ["**"]
    paths:
      - "phases/phase-3/**"
      - ".github/workflows/phase-3-ci.yml"

concurrency:
  group: phase-3-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: phases/phase-3

env:
  PYTHON_VERSION: "3.11"

jobs:
  lint:
    name: Lint e formatação
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install poetry
          poetry install --no-interaction --no-ansi --with dev

      - name: Lint with Ruff
        run: poetry run ruff check src/ tests/ scripts/ airflow/

      - name: Format with Ruff
        run: poetry run ruff format --check src/ tests/ scripts/ airflow/

  unit-test:
    name: Testes unitários
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install poetry
          poetry install --no-interaction --no-ansi --with dev

      - name: Run Unit Tests
        run: |
          poetry run pytest tests/unit \
            --cov=src \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-fail-under=70 \
            -v

  e2e-test:
    name: Testes ponta a ponta
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install poetry
          poetry install --no-interaction --no-ansi --with dev

      - name: Run E2E Tests
        run: poetry run pytest tests/e2e -v

  dag-validate:
    name: Integridade da DAG
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install Airflow
        run: pip install "apache-airflow==3.0.3"

      # Erro de import em DAG não quebra o CI da aplicação — só aparece quando
      # o scheduler já está em produção. Este job antecipa essa falha.
      - name: Import DAGs
        env:
          AIRFLOW__CORE__LOAD_EXAMPLES: "false"
          AIRFLOW__CORE__DAGS_FOLDER: ${{ github.workspace }}/phases/phase-3/airflow/dags
          PYTHONPATH: ${{ github.workspace }}/phases/phase-3
        run: |
          airflow db migrate
          airflow dags reserialize
          airflow dags list-import-errors 2>&1 | tee import-errors.txt
          if grep -q "triage_training_pipeline" import-errors.txt; then
            echo "::error::A DAG falhou ao importar"
            exit 1
          fi
          airflow dags list | grep triage_training_pipeline

  terraform-validate:
    name: Validação do Terraform
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.5"

      # Sem credenciais e sem backend: valida sintaxe, tipos e referências
      # entre recursos sem tocar em nenhuma conta AWS.
      - name: Terraform fmt
        run: terraform -chdir=src/infra fmt -check -diff

      - name: Terraform init
        run: terraform -chdir=src/infra init -backend=false -input=false

      - name: Terraform validate
        run: terraform -chdir=src/infra validate

  docker-build:
    name: Build da imagem de inferência
    runs-on: ubuntu-latest
    needs: [lint, unit-test]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: ./phases/phase-3
          file: ./phases/phase-3/docker/Dockerfile.api
          push: false
          load: true
          tags: medical-triage-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # A imagem sobe sem modelo montado: valida que o serviço entra em modo
      # degradado em vez de morrer no boot.
      - name: Smoke test the container
        run: |
          docker run -d --name triage-ci -p 8000:8000 medical-triage-api:ci
          for attempt in $(seq 1 20); do
            if curl -sf http://localhost:8000/health > /dev/null; then
              echo "API respondeu na tentativa $attempt"
              curl -s http://localhost:8000/health
              curl -sf http://localhost:8000/metrics > /dev/null
              docker rm -f triage-ci
              exit 0
            fi
            sleep 3
          done
          echo "::error::A API não respondeu ao health check"
          docker logs triage-ci
          docker rm -f triage-ci
          exit 1

  deploy:
    name: Deploy na AWS
    runs-on: ubuntu-latest
    needs: [lint, unit-test, e2e-test, docker-build, terraform-validate]
    # Desligado por padrão. A infraestrutura precisa existir antes (make
    # build-aws) e a variável AWS_DEPLOY_ENABLED precisa ser definida como
    # 'true' no repositório — sem isso, o job é pulado em vez de falhar.
    if: github.ref == 'refs/heads/main' && vars.AWS_DEPLOY_ENABLED == 'true'

    permissions:
      id-token: write
      contents: read

    env:
      AWS_REGION: us-east-1
      APP_NAME: medical-triage

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/${{ env.APP_NAME }}-github-deploy-role
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ./phases/phase-3
          file: ./phases/phase-3/docker/Dockerfile.api
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.ecr.outputs.registry }}/${{ env.APP_NAME }}:app-latest
            ${{ steps.ecr.outputs.registry }}/${{ env.APP_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Substitui a imagem na task definition corrente e força um novo deploy.
      # O circuit breaker do serviço reverte sozinho se as tasks novas não
      # ficarem saudáveis.
      - name: Deploy to ECS
        run: |
          set -euo pipefail

          aws ecs describe-task-definition \
            --task-definition "${APP_NAME}-api" \
            --query taskDefinition > task-definition.json

          python - <<'PY'
          import json, os

          with open("task-definition.json") as handle:
              task = json.load(handle)

          image = f"{os.environ['REGISTRY']}/{os.environ['APP_NAME']}:{os.environ['GITHUB_SHA']}"
          for container in task["containerDefinitions"]:
              if container["name"] in ("api", "train"):
                  container["image"] = image

          for field in (
              "taskDefinitionArn", "revision", "status", "requiresAttributes",
              "compatibilities", "registeredAt", "registeredBy",
          ):
              task.pop(field, None)

          with open("task-definition.json", "w") as handle:
              json.dump(task, handle)
          PY

          REVISION=$(aws ecs register-task-definition \
            --cli-input-json file://task-definition.json \
            --query 'taskDefinition.taskDefinitionArn' --output text)

          aws ecs update-service \
            --cluster "${APP_NAME}-cluster" \
            --service "${APP_NAME}-api" \
            --task-definition "$REVISION" \
            --query 'service.serviceName' --output text
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          APP_NAME: ${{ env.APP_NAME }}

      - name: Wait for service stability
        run: |
          aws ecs wait services-stable \
            --cluster "${{ env.APP_NAME }}-cluster" \
            --services "${{ env.APP_NAME }}-api"
